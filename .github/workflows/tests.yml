name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

concurrency:
  # Cancel outdated runs:
  # - Cancels an older push run when another push arrives on the same branch.
  # - Cancels an older PR run when another commit is pushed to that PR.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    env:
      REVIEWDOG_FILTER_MODE: file # Only process problems from files added/modified by the PR (when combined with the "github-check" reporter). Note: Not supported for pushes; it falls back to "nofilter" there, reporting all problems.
      REVIEWDOG_FAIL_LEVEL: error
      REVIEWDOG_REPORTER: github-check  # github-pr-review would be nice for PRs, but doesn't support PRs from forks
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@v7

    - name: Set up editorconfig-checker
      uses: editorconfig-checker/action-editorconfig-checker@v3.0.0
    - uses: reviewdog/action-setup@v1
    - name: Run editorconfig-checker
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        editorconfig-checker -no-color -f=gcc \
          | reviewdog \
            -efm='%f:%l:%c: %m' \
            -name=editorconfig-checker \
            -reporter="$REVIEWDOG_REPORTER" \
            -filter-mode="$REVIEWDOG_FILTER_MODE" \
            -fail-level="$REVIEWDOG_FAIL_LEVEL"

    - name: shellcheck
      uses: reviewdog/action-shellcheck@v1.34.1
      with:
        reporter: ${{ env.REVIEWDOG_REPORTER }}
        filter_mode: ${{ env.REVIEWDOG_FILTER_MODE }}
        fail_level: ${{ env.REVIEWDOG_FAIL_LEVEL }}
        pattern: |
          todo.sh
          todo_completion
          GEN-VERSION-FILE

    - name: actionlint  # checker for GitHub Actions workflow files
      uses: reviewdog/action-actionlint@v1.81.2
      with:
        reporter: ${{ env.REVIEWDOG_REPORTER }}
        filter_mode: ${{ env.REVIEWDOG_FILTER_MODE }}
        fail_level: ${{ env.REVIEWDOG_FAIL_LEVEL }}

  test:
    strategy:
      matrix:
        platform:
        - ubuntu-latest
        - ubuntu-22.04
        - macos-latest
        - macos-15
        - windows-latest
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail ${{ startsWith(matrix.platform, 'windows-') && '-o igncr' || '' }} {0}  # igncr makes Bash handle Windows CR-LF line endings in workflow-generated scripts
    steps:
    - name: Configure Git for Windows
      if: runner.os == 'Windows'
      run: git config --global core.autocrlf input  # Convert line endings on checkout
    - uses: actions/checkout@v7
    - name: Install Cygwin on Windows
      if: runner.os == 'Windows'
      uses: cygwin/cygwin-install-action@v7
      with:
        packages: |
          git
          make
          zip
    - name: Configure Git for Windows, part 2
      if: runner.os == 'Windows'
      run: git config --global --add safe.directory "$PWD"  # Silence Git complains about file ownership mismatches under Cygwin
    - run: make
    - run: make test
    - run: make -B doc
    - run: |
        modifiedFiles=$(git status --porcelain --untracked-files=no)
        if [ -n "$modifiedFiles" ]; then
          printf >&2 'ERROR: The following checked-in files were modified during the build:\n%s\n' "$modifiedFiles"
          exit 1
        fi
        untrackedFiles=$(git ls-files --others --exclude-standard)
        if [ -n "$untrackedFiles" ]; then
          printf >&2 'ERROR: The following files should be either ignored or checked in:\n%s\n' "$untrackedFiles"
          exit 1
        fi
    - run: make dist
    - run: make disttest
    - name: Check if sudo is available
      run: 'command -v sudo >/dev/null 2>&1 && echo SUDO=sudo >> "$GITHUB_ENV" || :'
    - run: $SUDO make install
    - run: $SUDO make uninstall
    - run: $SUDO make clean
